name: SolProp ML Prediction (Real)

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  # Keep/remove other triggers as needed

permissions:
  contents: write

jobs:
  run-solprop:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ---- Your existing setup steps (conda/python/deps/download zip/etc.) ----
      # Keep your current working steps here.
      # Example:
      # - name: Set up Python
      #   uses: actions/setup-python@v5
      #   with:
      #     python-version: "3.11"
      #
      # - name: Run prediction script
      #   run: python your_script.py

      - name: Show generated output files
        run: |
          echo "Listing output directory..."
          ls -la output || true

      - name: Commit output files
        id: commit_outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add output/

          if git diff --cached --quiet; then
            echo "No changes to commit."
            echo "committed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Add SolProp prediction outputs [skip ci]"
            echo "committed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Push changes
        if: steps.commit_outputs.outputs.committed == 'true'
        run: |
          # For branch runs this pushes back to same branch.
          # If permissions are missing (e.g., fork/read-only token), this may fail.
          git push origin HEAD:${GITHUB_REF_NAME}

      - name: Upload outputs as artifact (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: solprop-outputs-${{ github.run_number }}
          path: |
            output/*.csv
            output/*.txt
          if-no-files-found: warn
