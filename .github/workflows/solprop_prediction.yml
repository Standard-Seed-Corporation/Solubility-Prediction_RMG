name: SolProp ML Prediction (Real)

on:
  workflow_dispatch:
  push:
    paths:
      - 'input/**'
      - 'scripts/**'
      - '.github/workflows/solprop_prediction.yml'

permissions:
  contents: write

concurrency:
  group: solprop-${{ github.ref }}
  cancel-in-progress: false

jobs:
  predict:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        lfs: true

    - name: Free disk space on runner
      run: |
        echo "Before:"; df -h /
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
        sudo docker image prune --all --force >/dev/null 2>&1 || true
        echo "After:"; df -h /

    - name: Check model zip was downloaded from Git LFS
      run: |
        ls -lh SolProp_v1.2.zip
        if ! unzip -tq SolProp_v1.2.zip >/dev/null 2>&1; then
          echo "::error::SolProp_v1.2.zip is not a real zip (probably a Git LFS pointer). Check LFS storage/bandwidth quota for this repo."
          head -c 300 SolProp_v1.2.zip
          exit 1
        fi

    - name: Set up Conda
      uses: conda-incubator/setup-miniconda@v3
      with:
        auto-update-conda: true
        auto-activate-base: true
        activate-environment: ""
        channels: conda-forge,defaults
        channel-priority: flexible

    - name: Clone SolProp_ML repository
      shell: bash -l {0}
      run: |
        git clone --depth 1 https://github.com/fhvermei/SolProp_ML.git

    - name: Create conda environment from environment.yml
      shell: bash -l {0}
      env:
        PIP_NO_CACHE_DIR: "1"
      run: |
        cd SolProp_ML
        # environment.yml installs torch 1.6.0 via conda, then its pip section tries to
        # replace it with torch==1.3.1 (735 MB), which fails on the runner and rolls back.
        # Keep conda's torch and drop the pip torch pin.
        sed -i -E '/^[[:space:]]*-[[:space:]]*torch==/d' environment.yml
        echo "=== environment.yml used ==="
        cat environment.yml
        conda env create -n env_solprop -f environment.yml
        conda clean --all --yes
        df -h /

    - name: Show torch version
      shell: bash -l {0}
      run: |
        conda activate env_solprop
        python -c "import torch; print('torch', torch.__version__)"

    - name: Install descriptastorus and SolProp_ML
      shell: bash -l {0}
      run: |
        conda activate env_solprop
        pip install git+https://github.com/bp-kelley/descriptastorus
        cd SolProp_ML
        pip install -e .

    - name: Extract and set up ML models
      shell: bash -l {0}
      run: |
        unzip -q SolProp_v1.2.zip

        if [ ! -d "SolProp_v1.2/Machine_learning_models" ]; then
          echo "::error::Machine_learning_models directory not found after extraction"
          ls -la
          exit 1
        fi

        mkdir -p SolProp_ML/solvation_predictor/trained_models/
        cp -r SolProp_v1.2/Machine_learning_models/Gsolv SolProp_ML/solvation_predictor/trained_models/
        cp -r SolProp_v1.2/Machine_learning_models/Hsolv SolProp_ML/solvation_predictor/trained_models/
        cp -r SolProp_v1.2/Machine_learning_models/Saq SolProp_ML/solvation_predictor/trained_models/

        echo "Models installed successfully"
        ls -la SolProp_ML/solvation_predictor/trained_models/

    - name: Verify installation
      shell: bash -l {0}
      run: |
        conda activate env_solprop
        cd SolProp_ML
        python -c "from solvation_predictor import calculate_solubility; print('SolProp_ML imported successfully')"

    - name: Create output directory
      run: mkdir -p output

    - name: Run predictions
      shell: bash -l {0}
      run: |
        conda activate env_solprop
        export PYTHONPATH="${PYTHONPATH}:${PWD}/SolProp_ML"
        python scripts/run_prediction_real.py

    - name: List output files
      if: always()
      run: |
        echo "=== Generated output files ==="
        ls -lh output/ || true

    - name: Upload results as artifact
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: solprop-results-${{ github.run_number }}
        path: output/
        retention-days: 30

    - name: Commit and push results
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git add output/
        if git diff --staged --quiet; then
          echo "No changes to commit"
        else
          git commit -m "Add SolProp prediction results [run #${{ github.run_number }}]"
          git pull --rebase origin "${{ github.ref_name }}"
          git push origin HEAD:"${{ github.ref_name }}"
        fi
